<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Merkavania</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #rotate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000;
        color: #f0e6c8;
        font:
          16px font_ui,
          monospace;
        line-height: 1.6;
        text-align: center;
      }
      #rotate[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
